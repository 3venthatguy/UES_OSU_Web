<html lang="en">

    <title>UES at OSU</title>
    <meta
      name="description"
      content="The Undergraduate Economics Society at Ohio State — case competitions, events and masterclasses, research resources, and student membership."
    />

    <!--
      Tab icon, cropped from public/assets/logo/logo.jpeg. The source carries ~28%
      white padding on every side; at 16px that shrinks the bars to mush, so these
      are re-cropped to the mark itself. Regenerate all sizes together if the logo
      changes — see the crop box in the commit that added them.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#B03A40" />

    <!--
      Splash screen CSS — single source of truth.

      This block is inlined (never a stylesheet <link>) so #splash-boot below paints
      on the very first frame with ZERO network requests. The hero pulls ~23 MiB of
      3D assets; on a slow connection the alternative is a blank white page for a
      long time.

      src/components/SplashScreen.tsx reuses these class names and repeats these
      exact colours and sizes in Tailwind arbitrary values, so the handoff from the
      static panel to the React one is invisible. Change one, change both:
        field #B03A40 · tile 88px / radius 16px / white · logo 56px
        ring 132px / 3px stroke / #FDF8F1 @ 25% track / #F07B41 90deg arc
        spin 1.15s linear infinite
    -->
    <style>
      #splash-boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #b03a40;
        /* Tailwind's preflight hasn't loaded yet, so state the sans stack here or
           the wordmark renders serif and then swaps. */
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      #splash-boot .ues-splash-halo {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #2d0a0c2e 0%, transparent 55%);
      }

      /* The mark is absolutely centred, not stacked above the text, so its position
         is identical here and in SplashScreen.tsx regardless of what sits below. */
      #splash-boot .ues-splash-mark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #splash-boot .ues-splash-wordmark {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 98px);
        margin: 0;
        padding: 0 1.5rem;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fdf8f1;
      }

      #splash-boot .ues-splash-tile {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 15px -3px #2d0a0c40, 0 4px 6px -4px #2d0a0c40;
      }

      #splash-boot .ues-splash-tile img {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }

      .ues-splash-ring {
        animation: ues-splash-spin 1.15s linear infinite;
        transform-origin: 50% 50%;
        /* Forces a compositor layer so the ring keeps turning while the main
           thread is blocked parsing the 15 MiB .obj — that spin is the only
           "still alive" signal during a multi-second parse, and the JS-driven
           progress bar necessarily freezes right along with the parse. */
        will-change: transform;
      }

      .ues-splash-fade {
        animation: ues-splash-fade 300ms ease-out both;
      }

      @keyframes ues-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes ues-splash-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ues-splash-ring {
          animation: none;
        }
        .ues-splash-fade {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Boot splash: the idle state of SplashScreen, rendered before any JS runs.
      React removes it in a layout effect the moment its own splash paints.
      The logo is a base64 data URI, not /assets/logo/logo.jpeg, so this renders
      even when the network is unusable.

            fill="none"

    <!--
      Failsafe: if the bundle never loads or React throws, clear the panel rather
      than leaving a permanent red screen with nothing behind it.

      setTimeout(function () {

        if (boot) boot.remove();
      }, 30000);
